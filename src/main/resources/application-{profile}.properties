# Application
spring.application.name=ai-agent-platform

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2000

# AWS Bedrock Configuration
spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.anthropic.chat.options.model=anthropic.claude-3-sonnet-20240229-v1:0

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# Redis
spring.redis.host=localhost
spring.redis.port=6379

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters-long}
jwt.expiration=86400000

# Rate Limiting
rate-limit.default.capacity=100
rate-limit.default.refill=100

rate-limit.premium.capacity=1000
rate-limit.premium.refill=1000

# Cost Tracking
cost.models.gpt-4.input-price=0.03
cost.models.gpt-4.output-price=0.06

cost.models.gpt-3.5-turbo.input-price=0.0015
cost.models.gpt-3.5-turbo.output-price=0.002

cost.models.claude-3-sonnet.input-price=0.003
cost.models.claude-3-sonnet.output-price=0.015

# Guardrails
guardrail.pii-enabled=true
guardrail.content-moderation=true
guardrail.max-input-length=10000
guardrail.blocked-words=hack,exploit,illegal,bomb